version: '3.8'

services:
  # Main application
  business-voice-agent:
    build: .
    container_name: business-voice-agent
    restart: unless-stopped
    ports:
      - "3000:3000"    # Main dashboard
      - "3001:3001"    # Voice API
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VOICE_PORT=3001
      - DATABASE_PATH=/app/data/analytics.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # Persistent data
      - ./logs:/app/logs          # Logs
      - ./config:/app/config      # Configuration (can be modified at runtime)
    networks:
      - voice-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (for SSL/external access)
  nginx:
    image: nginx:alpine
    container_name: voice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - business-voice-agent
    networks:
      - voice-network

  # SQLite database browser (optional, for debugging)
  db-browser:
    image: coleifer/sqlite-web
    container_name: voice-db-browser
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    command: ["sqlite_web", "/data/analytics.db", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - voice-network
    profiles:
      - debug

networks:
  voice-network:
    driver: bridge

volumes:
  voice-data:
  voice-logs:
