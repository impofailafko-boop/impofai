<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Business Voice Agent</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-header {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #4F46E5;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 14px;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .transcript-list {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .transcript-item {
      padding: 20px;
      border-bottom: 1px solid #E5E7EB;
      cursor: pointer;
      transition: background 0.2s;
    }

    .transcript-item:hover {
      background: #F9FAFB;
    }

    .transcript-item:last-child {
      border-bottom: none;
    }

    .transcript-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .transcript-worker {
      font-weight: 600;
      font-size: 16px;
      color: #111827;
    }

    .transcript-role {
      display: inline-block;
      padding: 4px 12px;
      background: #EEF2FF;
      color: #4F46E5;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-left: 10px;
    }

    .transcript-time {
      font-size: 14px;
      color: #6B7280;
    }

    .transcript-meta {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #6B7280;
    }

    .transcript-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6B7280;
    }

    .modal-body {
      padding: 24px;
    }

    .conversation {
      margin-top: 20px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
    }

    .message-worker {
      background: #EEF2FF;
      border-left: 4px solid #4F46E5;
    }

    .message-agent {
      background: #F0FDF4;
      border-left: 4px solid #10B981;
    }

    .message-speaker {
      font-weight: 600;
      font-size: 13px;
      color: #374151;
      margin-bottom: 4px;
    }

    .message-time {
      font-size: 11px;
      color: #9CA3AF;
      margin-left: 8px;
    }

    .message-text {
      font-size: 15px;
      color: #1F2937;
      line-height: 1.6;
    }

    .filters {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 2px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
    }

    .filter-select {
      padding: 10px 16px;
      border: 2px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .refresh-btn:hover {
      background: #4338CA;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9CA3AF;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .delete-btn {
      padding: 8px 16px;
      background: #EF4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
    }

    .delete-btn:hover {
      background: #DC2626;
    }

    .export-btn {
      padding: 10px 20px;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      margin-left: 10px;
    }

    .export-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <h1>📊 Admin Panel</h1>
      <p>View and manage all voice conversations</p>
    </div>

    <div class="admin-stats" id="adminStats">
      <div class="stat-card">
        <div class="stat-value" id="totalConversations">-</div>
        <div class="stat-label">Total Conversations</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalMessages">-</div>
        <div class="stat-label">Total Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalDuration">-</div>
        <div class="stat-label">Total Duration (min)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="uniqueWorkers">-</div>
        <div class="stat-label">Unique Workers</div>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <input
          type="text"
          class="filter-input"
          id="searchInput"
          placeholder="Search by worker name or session ID..."
        />
        <select class="filter-select" id="roleFilter">
          <option value="">All Roles</option>
        </select>
        <button class="refresh-btn" onclick="loadTranscripts()">🔄 Refresh</button>
        <button class="export-btn" onclick="exportAllTranscripts()">📥 Export All</button>
      </div>

      <div class="transcript-list" id="transcriptList">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <p>Loading conversations...</p>
        </div>
      </div>
    </div>

    <div style="margin-top: 20px; text-align: center;">
      <a href="/" style="color: #6B7280;">← Back to Home</a> |
      <a href="/voice-realtime" style="color: #6B7280;">Start New Conversation →</a>
    </div>
  </div>

  <!-- Transcript Modal -->
  <div id="transcriptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Conversation Details</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Content will be loaded here -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
  <script>
    let allTranscripts = [];

    // Load transcripts on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadTranscripts();
      setupFilters();
    });

    async function loadTranscripts() {
      try {
        const response = await fetch('/api/transcripts');
        const data = await response.json();

        allTranscripts = data.transcripts || [];

        // Update stats
        updateStats(allTranscripts);

        // Populate role filter
        populateRoleFilter(allTranscripts);

        // Display transcripts
        displayTranscripts(allTranscripts);

      } catch (error) {
        console.error('Failed to load transcripts:', error);
        showToast('Failed to load conversations', 'danger');

        document.getElementById('transcriptList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>Failed to load conversations</p>
          </div>
        `;
      }
    }

    function updateStats(transcripts) {
      const totalConversations = transcripts.length;
      const totalMessages = transcripts.reduce((sum, t) => sum + (t.summary?.totalMessages || 0), 0);
      const totalDuration = Math.floor(transcripts.reduce((sum, t) => sum + (t.duration || 0), 0) / 60);
      const uniqueWorkers = new Set(transcripts.map(t => t.workerId)).size;

      document.getElementById('totalConversations').textContent = totalConversations;
      document.getElementById('totalMessages').textContent = totalMessages;
      document.getElementById('totalDuration').textContent = totalDuration;
      document.getElementById('uniqueWorkers').textContent = uniqueWorkers;
    }

    function populateRoleFilter(transcripts) {
      const roles = [...new Set(transcripts.map(t => t.roleName))].filter(Boolean);
      const roleFilter = document.getElementById('roleFilter');

      roles.forEach(role => {
        const option = document.createElement('option');
        option.value = role;
        option.textContent = role;
        roleFilter.appendChild(option);
      });
    }

    function displayTranscripts(transcripts) {
      const listEl = document.getElementById('transcriptList');

      if (transcripts.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <p>No conversations yet</p>
            <p style="margin-top: 8px;"><a href="/voice-realtime">Start your first conversation →</a></p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = transcripts.map(transcript => {
        const startTime = new Date(transcript.startTime);
        const duration = Math.floor(transcript.duration / 60);
        const seconds = transcript.duration % 60;

        return `
          <div class="transcript-item" onclick="viewTranscript('${transcript.sessionId}')">
            <div class="transcript-header">
              <div>
                <span class="transcript-worker">👤 ${transcript.workerId}</span>
                <span class="transcript-role">${transcript.roleName || 'Unknown Role'}</span>
              </div>
              <div class="transcript-time">${formatDateTime(startTime)}</div>
            </div>
            <div class="transcript-meta">
              <span>⏱️ ${duration}m ${seconds}s</span>
              <span>💬 ${transcript.summary?.totalMessages || 0} messages</span>
              <span>📝 ${transcript.summary?.workerMessages || 0} from worker</span>
              <span>🤖 ${transcript.summary?.agentMessages || 0} from AI</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDateTime(date) {
      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

    async function viewTranscript(sessionId) {
      try {
        const response = await fetch(`/api/transcripts/${sessionId}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error('Transcript not found');
        }

        const transcript = data.transcript;

        // Update modal
        document.getElementById('modalTitle').innerHTML = `
          <div>
            <div style="font-size: 20px; font-weight: 600;">💬 ${transcript.workerId}</div>
            <div style="font-size: 14px; color: #6B7280; margin-top: 4px;">
              ${transcript.roleName} • ${formatDateTime(new Date(transcript.startTime))}
            </div>
          </div>
        `;

        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = `
          <div style="background: #F9FAFB; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;">
              <div>
                <div style="font-size: 12px; color: #6B7280; text-transform: uppercase; margin-bottom: 4px;">Duration</div>
                <div style="font-size: 18px; font-weight: 600; color: #111827;">${Math.floor(transcript.duration / 60)}m ${transcript.duration % 60}s</div>
              </div>
              <div>
                <div style="font-size: 12px; color: #6B7280; text-transform: uppercase; margin-bottom: 4px;">Messages</div>
                <div style="font-size: 18px; font-weight: 600; color: #111827;">${transcript.summary?.totalMessages || 0}</div>
              </div>
              <div>
                <div style="font-size: 12px; color: #6B7280; text-transform: uppercase; margin-bottom: 4px;">Worker</div>
                <div style="font-size: 18px; font-weight: 600; color: #111827;">${transcript.summary?.workerMessages || 0}</div>
              </div>
              <div>
                <div style="font-size: 12px; color: #6B7280; text-transform: uppercase; margin-bottom: 4px;">AI</div>
                <div style="font-size: 18px; font-weight: 600; color: #111827;">${transcript.summary?.agentMessages || 0}</div>
              </div>
            </div>
          </div>

          <div class="conversation">
            ${transcript.transcript.map(entry => `
              <div class="message message-${entry.speaker}">
                <div class="message-speaker">
                  ${entry.speaker === 'worker' ? '👤 Worker' : '🤖 AI Assistant'}
                  <span class="message-time">${new Date(entry.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="message-text">${entry.text}</div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid #E5E7EB; display: flex; justify-content: space-between;">
            <button class="delete-btn" onclick="deleteTranscript('${transcript.sessionId}')">🗑️ Delete Conversation</button>
            <button class="export-btn" onclick="exportTranscript('${transcript.sessionId}')">📥 Export</button>
          </div>
        `;

        // Show modal
        document.getElementById('transcriptModal').classList.add('active');

      } catch (error) {
        console.error('Failed to load transcript:', error);
        showToast('Failed to load conversation details', 'danger');
      }
    }

    function closeModal() {
      document.getElementById('transcriptModal').classList.remove('active');
    }

    async function deleteTranscript(sessionId) {
      if (!confirm('Delete this conversation? This cannot be undone.')) {
        return;
      }

      try {
        const response = await fetch(`/api/transcripts/${sessionId}`, {
          method: 'DELETE'
        });

        const data = await response.json();

        if (data.success) {
          showToast('Conversation deleted', 'success');
          closeModal();
          loadTranscripts();
        } else {
          throw new Error('Failed to delete');
        }
      } catch (error) {
        showToast('Failed to delete conversation', 'danger');
      }
    }

    function exportTranscript(sessionId) {
      const transcript = allTranscripts.find(t => t.sessionId === sessionId);

      if (!transcript) return;

      const dataStr = JSON.stringify(transcript, null, 2);
      const dataBlob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `transcript_${sessionId}.json`;
      link.click();
      URL.revokeObjectURL(url);

      showToast('Transcript exported', 'success');
    }

    function exportAllTranscripts() {
      if (allTranscripts.length === 0) {
        showToast('No conversations to export', 'warning');
        return;
      }

      const dataStr = JSON.stringify(allTranscripts, null, 2);
      const dataBlob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `all_transcripts_${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);

      showToast('All transcripts exported', 'success');
    }

    // Setup filters
    function setupFilters() {
      const searchInput = document.getElementById('searchInput');
      const roleFilter = document.getElementById('roleFilter');

      searchInput.addEventListener('input', applyFilters);
      roleFilter.addEventListener('change', applyFilters);
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const roleFilter = document.getElementById('roleFilter').value;

      const filtered = allTranscripts.filter(transcript => {
        const matchesSearch = !searchTerm ||
          transcript.workerId.toLowerCase().includes(searchTerm) ||
          transcript.sessionId.toLowerCase().includes(searchTerm);

        const matchesRole = !roleFilter || transcript.roleName === roleFilter;

        return matchesSearch && matchesRole;
      });

      displayTranscripts(filtered);
    }

    // Close modal when clicking outside
    document.getElementById('transcriptModal').addEventListener('click', (e) => {
      if (e.target.id === 'transcriptModal') {
        closeModal();
      }
    });

    // Auto-refresh every 30 seconds
    setInterval(loadTranscripts, 30000);
  </script>
</body>
</html>
