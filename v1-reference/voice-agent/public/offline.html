<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Business Voice Agent</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="mobile-container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎤</span>
        <span class="logo-text">Business Voice</span>
      </div>
    </header>

    <main class="main-content">
      <div class="hero" style="text-align: center; padding: 4rem 1rem;">
        <div style="font-size: 5rem; margin-bottom: 2rem;">📡</div>
        <h1>You're Offline</h1>
        <p style="margin: 1rem 0 2rem;">No internet connection detected. Some features may be unavailable.</p>

        <button class="btn btn-primary" onclick="window.location.reload()">
          Try Again
        </button>

        <div style="margin-top: 3rem; padding: 2rem; background: white; border-radius: 1rem;">
          <h3 style="margin-bottom: 1rem;">What you can still do:</h3>
          <ul style="text-align: left; list-style: none; padding: 0;">
            <li style="padding: 0.5rem 0;">✅ View cached pages</li>
            <li style="padding: 0.5rem 0;">✅ Review previous conversations</li>
            <li style="padding: 0.5rem 0;">✅ Check configuration</li>
          </ul>
        </div>

        <div style="margin-top: 2rem;">
          <p class="help-text">Data will sync when you're back online</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Business Voice Agent v1.0.0</p>
      <p>PWA Mode Active</p>
    </footer>
  </div>
</body>
</html>
