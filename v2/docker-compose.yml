# ImpofAI V2 Docker Compose
version: '3.8'

services:
  impofai-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impofai-v2
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3002}:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3002
      - AGENTDB_PATH=/app/data/agentdb.sqlite
      - DEFAULT_LANGUAGE=sk-SK
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - impofai-v2-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  impofai-v2-network:
    driver: bridge

volumes:
  impofai-v2-data:
  impofai-v2-logs:
