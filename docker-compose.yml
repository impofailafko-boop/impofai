# ImpofAI Docker Compose
# For development and production deployment

version: '3.8'

services:
  impofai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impofai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AGENTDB_PATH=/app/data/agentdb.sqlite
      - DEFAULT_LANGUAGE=sk-SK
      - VOICE_MODEL=gpt-4o-realtime-preview-2024-10-01
      - ALLOWED_ORIGINS=http://localhost:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - impofai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: impofai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - impofai
    networks:
      - impofai-network
    profiles:
      - production

networks:
  impofai-network:
    driver: bridge

volumes:
  impofai-data:
  impofai-logs:
